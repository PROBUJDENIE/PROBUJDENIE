type: object

required:
  - exerciseId
  - memoryLimit
  - timeLimit
  - inputData
  - outputData

properties:
  exerciseId:
    type: string
    format: uuid
  memoryLimit:
    type: integer
    format: int32
    minimum: 0
  timeLimit:
    type: integer
    format: int32
    minimum: 0
  inputData:
    type: string
    minLength: 3
    maxLength: 1000
  outputData:
    type: string
    minLength: 0
    maxLength: 1000
