spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.datasource.url=jdbc:h2:mem:test_db
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.change-log=classpath:liquibase/changelog/changelog.xml
spring.liquibase.enabled=true
spring.liquibase.drop-first=false

spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.credentials.access-key=admin
spring.cloud.aws.credentials.secret-key=admin123456
spring.cloud.aws.s3.endpoint=http://s3:9000
spring.cloud.aws.s3.path-style-access-enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB

app.bootstrap.enabled=true

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss} %level: %msg%n


submission-check.fixed-delay-ms=10000
submission-check.lock-at-most-for=5m
submission-check.lock-at-least-for=5s

