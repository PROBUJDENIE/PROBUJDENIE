allOf:
  - $ref: '../../BaseResponseDto.yaml'
  - type: object
    title: LectureGetLectureItemResponseDto
    required:
      - title
      - orderNumber
      - status
    properties:
      title:
        type: string
        minLength: 3
        maxLength: 255
      contentId:
        type: string
        format: UUID
      orderNumber:
        type: integer
        format: int32
        minimum: 0
      status:
        type: string
        enum:
          - CREATED
          - READY
          - DELETED