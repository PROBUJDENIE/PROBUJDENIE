get:
  operationId: getSectionPage
  tags:
    - studentSecure
  parameters:
    - name: courseId
      in: path
      required: true
      schema:
        type: string
        format: UUID
    - name: offset
      in: query
      required: true
      schema:
        type: integer
        format: int32
    - name: count
      in: query
      required: true
      schema:
        type: integer
        format: int32
  responses:
    '200':
      description: Возвращает список cекций указанного курса.
      content:
        application/json:
          schema:
              $ref: '../response/GetSectionsResponseDto.yaml'