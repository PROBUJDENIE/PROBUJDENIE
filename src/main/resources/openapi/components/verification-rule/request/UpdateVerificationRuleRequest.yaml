type: object

required:
  - id
  - exerciseId
  - memoryLimit
  - timeLimit
  - inputData
  - outputData

properties:
  id:
    type: string
    format: UUID
  exerciseId:
    type: string
    format: uuid
  memoryLimit:
    type: number
    format: integer
    minimum: 0
  timeLimit:
    type: number
    format: integer
    minimum: 0
  inputData:
    type: string
    minLength: 3
    maxLength: 1000
  outputData:
    type: string
    minLength: 0
    maxLength: 1000
