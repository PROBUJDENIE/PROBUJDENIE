post:
  operationId: updateFile
  tags:
    - teacherSecure
  parameters:
    - name: fileId
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: '../../components/schemas/teacher-secure/request/SaveFileRequestDto.yaml'
  responses:
    '200':
      description: Возвращает id объекта в S3
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/teacher-secure/response/SaveFileResponseDto.yaml'